name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root workspaces
        run: npm ci
      - name: Typecheck (core + landing + app)
        run: npm run typecheck
      - name: Test (app)
        run: npm test

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile deps
        working-directory: apps/mobile
        run: npm ci
      - name: Typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit
